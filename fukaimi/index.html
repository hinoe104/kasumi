<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>感覚標本室</title>
<link rel="preload" as="image" href="img/kuroyuri_metoji.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --moss:#3e4f43;
  --moss-deep:#1f2a24;
  --sage:#8a9a86;
  --brass:#b09457;
  --brass-dim:#7d6a3f;
  --sepia:#d8ccb4;
  --paper:#e9e1cf;
  --rose:#b58e8a;
  --glass:rgba(233,228,214,.10);
  --ink:#ece4d2;
  --ink-dim:#b4ab98;
  --shade:rgba(18,24,21,.78);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--moss-deep);
  color:var(--ink);
  font-family:"Shippori Mincho B1","IM Fell English",serif;
  letter-spacing:.04em;line-height:1.8;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink)}

/* ---------- 背景（黒百合） ---------- */
.bg{
  position:fixed;inset:0;z-index:0;
  background:#1c2420 url("img/kuroyuri_hoozue.webp") center 30%/cover no-repeat;
  filter:saturate(.72) sepia(.14) contrast(.96);
  transition:filter 1.2s ease;
}
/* 目閉じ：横長寄り(4:5)なので顔（横58%・縦28%付近）を軸にトリミング */
.bg.closed{background-image:url("img/kuroyuri_metoji.webp");background-position:58% 22%}
@media (min-aspect-ratio:4/5){.bg.closed{background-position:58% 30%}}
.bg.dim{filter:saturate(.5) sepia(.25) brightness(.42) blur(2px)}
.grain{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% 40%, transparent 50%, rgba(10,14,12,.65) 100%),
    linear-gradient(180deg, rgba(20,26,22,0) 55%, rgba(20,26,22,.85) 100%);
}

/* ---------- 画面 ---------- */
.screen{
  position:fixed;inset:0;z-index:2;
  display:none;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  overflow-y:auto;
}
.screen.on{display:flex;animation:fade .7s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wrap{width:100%;max-width:560px;margin:0 auto}

/* ---------- タイトル ---------- */
#title{justify-content:flex-end;align-items:center;text-align:center;cursor:pointer}
#title h1{
  font-weight:800;font-size:clamp(40px,12vw,64px);letter-spacing:.25em;
  text-shadow:0 2px 18px rgba(0,0,0,.7);
  margin-bottom:4px;padding-left:.25em;
}
#title .en{font-size:clamp(11px,3.4vw,15px);white-space:nowrap;font-family:"IM Fell English",serif;font-style:italic;color:var(--sepia);letter-spacing:.2em;opacity:.9}
#title .tap{margin:40px 0 28px;font-size:14px;color:var(--ink-dim);animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- 真鍮の枠 ---------- */
.brass{
  position:relative;
  background:linear-gradient(180deg,rgba(38,48,42,.86),rgba(24,31,27,.9));
  border:1px solid var(--brass-dim);
  box-shadow:inset 0 0 0 3px rgba(20,26,22,.9), inset 0 0 0 4px rgba(176,148,87,.45), 0 8px 24px rgba(0,0,0,.45);
  border-radius:3px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.brass::before,.brass::after{
  content:"";position:absolute;width:10px;height:10px;border:1px solid var(--brass);
  transform:rotate(45deg);background:var(--moss-deep);top:-6px;
}
.brass::before{left:14px}.brass::after{right:14px}

/* ---------- メイン ---------- */
.speech{padding:22px 20px 18px;margin-bottom:14px;min-height:112px}
.speech .name{
  position:absolute;top:-14px;left:28px;padding:0 12px;
  background:var(--moss-deep);border:1px solid var(--brass-dim);
  font-size:13px;color:var(--brass);letter-spacing:.2em;
}
.speech p{font-size:15px;white-space:pre-wrap}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  padding:14px 10px;text-align:center;font-size:15px;
  background:linear-gradient(180deg,rgba(62,79,67,.88),rgba(31,42,36,.92));
  border:1px solid var(--brass-dim);
  box-shadow:inset 0 1px 0 rgba(216,204,180,.18), inset 0 0 0 3px rgba(20,26,22,.5);
  border-radius:3px;transition:border-color .2s, background .2s;
}
.btn:hover,.btn:focus-visible{border-color:var(--brass);outline:none}
.btn:active{transform:translateY(1px)}
.btn small{display:block;font-family:"IM Fell English",serif;font-style:italic;font-size:11px;color:var(--ink-dim);letter-spacing:.12em}
.btn.primary{border-color:var(--brass);background:linear-gradient(180deg,rgba(125,106,63,.55),rgba(52,48,34,.9))}
.btn.ghost{background:rgba(20,26,22,.55)}
.btn:disabled{opacity:.4;cursor:default}
.menu .wide{grid-column:1/-1}
.sync{margin-top:10px;font-size:11px;color:var(--ink-dim);text-align:center}
.sync button{text-decoration:underline;font-size:11px;color:var(--ink-dim)}

/* ---------- ホーム（ソシャゲ風HUD） ---------- */
#main{padding-left:12px;padding-right:12px}
.hud{display:flex;align-items:center;justify-content:space-between}
.plate{
  font-size:15px;font-weight:700;letter-spacing:.25em;padding:6px 16px 6px 18px;
  background:linear-gradient(90deg,rgba(20,26,22,.85),rgba(20,26,22,.35));
  border-left:2px solid var(--brass);display:flex;align-items:center;gap:10px;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-dim)}
.dot.ok{background:#8fae7e;box-shadow:0 0 6px #8fae7e}.dot.ng{background:var(--rose)}
svg{stroke-linecap:round;stroke-linejoin:round}
.dock{margin-top:auto;width:100%;max-width:560px;align-self:center;display:flex;flex-direction:column}
.dive{
  align-self:flex-end;position:relative;width:92px;height:92px;border-radius:50%;margin:0 6px -18px 0;z-index:2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 35% 30%,rgba(150,128,78,.95),rgba(52,48,34,.97));
  border:1px solid var(--brass);
  box-shadow:inset 0 0 0 4px rgba(20,26,22,.6),inset 0 0 0 5px rgba(216,204,180,.35),0 6px 18px rgba(0,0,0,.6);
}
.dive b{font-size:17px;letter-spacing:.08em;white-space:nowrap}
.dive small{font-family:"IM Fell English",serif;font-style:italic;font-size:10px;color:var(--sepia)}
.dive .ring{position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(176,148,87,.5);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{inset:-12px;opacity:.15}}
#main .speech{margin-bottom:6px;cursor:pointer;min-height:96px;padding-right:40px}
.speech .next{position:absolute;right:16px;bottom:10px;font-size:10px;color:var(--brass);animation:blink 1.6s infinite}
#main .sync{margin-top:2px}


/* ---------- 目録（引き出しメニュー） ---------- */
.idxtab{
  position:fixed;left:0;top:34%;z-index:4;padding:14px 7px 14px 5px;
  background:linear-gradient(90deg,rgba(18,24,21,.92),rgba(31,42,36,.88));
  border:1px solid rgba(176,148,87,.7);border-left:0;border-radius:0 3px 3px 0;
  box-shadow:3px 4px 12px rgba(0,0,0,.45);transition:transform .35s ease, opacity .35s;
}
.idxtab{display:flex;flex-direction:column;align-items:center;gap:6px;width:30px}
.idxtab span{display:block;font-size:13px;line-height:1;color:var(--sepia)}
.idxtab::after{content:"";position:absolute;right:3px;top:6px;bottom:6px;border-right:1px solid rgba(176,148,87,.3)}
body.drawer-open .idxtab{transform:translateX(-100%);opacity:0}
.drawer-veil{position:fixed;inset:0;z-index:8;background:rgba(10,14,12,.55);opacity:0;pointer-events:none;transition:opacity .4s ease}
.drawer{
  position:fixed;top:0;bottom:0;left:0;z-index:9;width:min(80vw,320px);
  display:flex;flex-direction:column;padding:max(22px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom));
  background:
    repeating-linear-gradient(0deg,rgba(216,204,180,.025) 0 1px,transparent 1px 4px),
    linear-gradient(100deg,#1b2420,#26322b 70%,#222c26);
  border-right:1px solid var(--brass-dim);box-shadow:inset -5px 0 0 -4px rgba(176,148,87,.35),8px 0 30px rgba(0,0,0,.55);
  transform:translateX(-104%);transition:transform .5s cubic-bezier(.22,.9,.25,1);
}
body.drawer-open .drawer{transform:none}
body.drawer-open .drawer-veil{opacity:1;pointer-events:auto}
.dhead{display:flex;align-items:baseline;gap:10px;padding-bottom:14px;border-bottom:1px solid rgba(176,148,87,.35);margin-bottom:8px}
.dhead b{font-size:20px;letter-spacing:.4em;font-weight:500}
.dhead i{font-family:"IM Fell English",serif;color:var(--brass);letter-spacing:.15em}
.dclose{margin-left:auto;font-size:22px;color:var(--ink-dim);line-height:1;padding:0 4px}
.dlist button,.dfoot button{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 4px;
  border-bottom:1px dashed rgba(176,148,87,.22);
  opacity:0;transform:translateX(-14px);transition:opacity .4s ease, transform .4s ease;
}
body.drawer-open .dlist button,body.drawer-open .dfoot button{opacity:1;transform:none}
body.drawer-open .dlist button:nth-child(1){transition-delay:.12s}
body.drawer-open .dlist button:nth-child(2){transition-delay:.19s}
body.drawer-open .dlist button:nth-child(3){transition-delay:.26s}
body.drawer-open .dfoot button{transition-delay:.33s}
.dlist .no{width:2.2em;font-family:"IM Fell English",serif;font-style:italic;color:var(--brass-dim);font-size:13px}
.dlist svg,.dfoot svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--brass);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.dlist .t b{display:block;font-size:17px;letter-spacing:.2em;font-weight:500}
.dlist .t small{font-size:11px;color:var(--ink-dim);letter-spacing:.06em}
.dlist button:active{background:rgba(176,148,87,.08)}
.fern{display:block;width:100%;margin:14px auto 0;overflow:visible}
.fern .st{fill:none;stroke:#a58a4f;stroke-width:1.1;stroke-linecap:round}
.fern .lf{fill:url(#goldG);fill-opacity:.8;stroke:#d2bd86;stroke-opacity:.55;stroke-width:.4}
.dfoot{margin-top:auto}
.dfoot button{border:0;font-size:13px;color:var(--ink-dim);padding:10px 4px}
.dfoot p{font-size:11px;color:var(--ink-dim);padding-left:40px}

/* ---------- 共通ヘッダ ---------- */
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.head h2{font-size:18px;letter-spacing:.2em;font-weight:700}
.head .back{font-size:13px;color:var(--ink-dim);padding:6px 4px}
.panel{padding:20px 18px;margin-bottom:14px}
.panel h3{font-size:14px;color:var(--brass);letter-spacing:.15em;margin-bottom:10px;font-weight:500}
.lead{font-size:15px;white-space:pre-wrap;margin-bottom:14px}
.muted{color:var(--ink-dim);font-size:13px}

/* ---------- 部位選択 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.openstart{display:block;width:100%;text-align:left;padding:18px 18px 16px;margin-bottom:6px}
.openstart b{display:block;font-size:17px;letter-spacing:.12em;margin-bottom:4px}
.openstart span{font-size:12px;color:var(--ink-dim);line-height:1.7;display:block}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 12px;font-size:11px;color:var(--ink-dim);letter-spacing:.12em}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(176,148,87,.25)}
.pgroup{display:grid;grid-template-columns:3.2em 1fr;align-items:center;gap:8px;padding:5px 0;border-top:1px solid rgba(176,148,87,.12)}
.pgroup:first-child{border-top:0;padding-top:0}
.pgroup .g{font-size:11px;color:var(--brass);letter-spacing:.2em}
.pgroup .tags{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tag{
  position:relative;padding:5px 2px;font-size:13px;text-align:center;letter-spacing:.06em;
  border:1px solid rgba(176,148,87,.28);background:rgba(20,26,22,.35);border-radius:1px;transition:all .2s;
}
.tag.sel{border-color:var(--brass);background:rgba(125,106,63,.42);color:#fff}
.tag .no{position:absolute;top:-7px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--brass);color:var(--moss-deep);font-size:10px;line-height:16px;font-family:"IM Fell English",serif}
.chip{
  padding:7px 13px;font-size:14px;border:1px solid rgba(176,148,87,.4);border-radius:999px;
  background:rgba(20,26,22,.5);transition:all .2s;
}
.chip.sel{border-color:var(--brass);background:rgba(125,106,63,.5);color:#fff}
.addrow{display:flex;gap:8px;margin-top:12px}
.field{
  flex:1;min-width:0;padding:10px 12px;background:rgba(233,228,214,.06);
  border:1px solid rgba(176,148,87,.35);border-radius:2px;outline:none;
}
.field:focus{border-color:var(--brass)}
textarea.field{width:100%;min-height:80px;resize:vertical}

/* ---------- 進行 ---------- */
.steps{display:flex;gap:4px;margin-bottom:12px}
.steps span{flex:1;height:3px;background:rgba(176,148,87,.2)}
.steps span.on{background:var(--brass)}
.partname{font-size:22px;font-weight:700;letter-spacing:.12em;margin-bottom:4px}
.counter{font-size:12px;color:var(--ink-dim);font-family:"IM Fell English",serif;font-style:italic}
.row{display:flex;gap:10px;margin-top:14px}
.row .btn{flex:1}
.safety{display:flex;gap:8px;justify-content:center;margin-top:auto;padding:14px 0 2px;position:sticky;bottom:0;z-index:3;background:linear-gradient(180deg,transparent,rgba(20,26,22,.92) 40%)}
.safety button{
  font-size:12px;padding:6px 12px;border:1px solid rgba(181,142,138,.5);border-radius:999px;
  color:var(--rose);background:rgba(20,26,22,.6);
}
.links{display:flex;justify-content:center;gap:24px;margin-top:12px}
.links button{font-size:13px;color:var(--ink-dim);border-bottom:1px solid rgba(176,148,87,.4);padding:2px 0}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.words .chip{font-size:13px;padding:4px 10px}
.hint{font-size:12px;color:var(--ink-dim);margin-top:8px}

/* ---------- 呼吸（水銀柱） ---------- */
.bwrap{display:flex;flex-direction:column;flex:1;align-items:center}
.bwrap .head{width:100%}
#bSafety,.bguide{display:none}
#breath.insession #bSafety{display:flex;width:100%}
#breath.insession .bctrl,#breath.insession .back,#breath.insession #bStart{display:none}
#breath.insession .bguide{display:block;width:100%;text-align:center;font-size:13px;color:var(--ink-dim);line-height:1.8;min-height:3.6em;white-space:pre-wrap}
.pager{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.pager i{width:5px;height:5px;border-radius:50%;background:rgba(176,148,87,.3)}
.pager i.on{background:var(--brass)}
.bstage{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;width:100%;min-height:0}
.thermo{height:clamp(230px,calc(100dvh - 400px),min(56vh,420px));width:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.bread{width:8.5em;text-align:left}
.ben{font-family:"IM Fell English",serif;font-style:italic;font-size:14px;color:var(--brass);letter-spacing:.15em;height:1.4em}
.breath-label{font-size:34px;letter-spacing:.3em;font-weight:500;line-height:1.3;transition:opacity .6s}
.breath-sub{font-size:12px;color:var(--ink-dim);margin-top:6px;font-variant-numeric:tabular-nums}
.bprog{width:min(240px,70%);height:1px;background:rgba(176,148,87,.2);margin:8px 0 12px}
.bprog span{display:block;height:100%;width:0;background:var(--brass)}
.bctrl{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 18px;width:min(280px,86%);transition:opacity .6s}
.bctrl.quiet{opacity:.2;pointer-events:none}
.olbl{font-size:11px;color:var(--brass);letter-spacing:.3em}
.opt{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid rgba(176,148,87,.15)}
.opt button{font-size:13px;color:var(--ink-dim);padding:7px 0;letter-spacing:.08em;position:relative}
.opt button.on{color:var(--ink)}
.opt button.on::after{content:"";position:absolute;left:50%;bottom:-1px;width:1.8em;height:1px;background:var(--brass);transform:translateX(-50%)}
.orb{align-self:center;margin:16px 0 0;width:84px;height:84px}
.orb b{font-size:14px;letter-spacing:.15em}
#bStart.running{background:radial-gradient(circle at 35% 30%,rgba(62,79,67,.95),rgba(20,26,22,.95))}
#bStart.running .ring{animation:none;opacity:0}

/* ---------- 採集帳（履歴） ---------- */
.month{display:flex;align-items:baseline;gap:10px;margin:18px 2px 8px;font-size:15px;letter-spacing:.18em;font-weight:500}
.month:first-child{margin-top:4px}
.month::after{content:"";flex:1;height:1px;background:rgba(176,148,87,.3)}
.month span{font-size:11px;color:var(--ink-dim);letter-spacing:.1em;order:2}
.label{
  position:relative;margin-bottom:10px;padding:12px 14px 10px;cursor:pointer;
  background:linear-gradient(180deg,rgba(38,48,42,.88),rgba(24,31,27,.92));
  border:1px solid rgba(176,148,87,.45);outline:1px solid rgba(176,148,87,.18);outline-offset:-5px;
}
.lhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed rgba(176,148,87,.25)}
.ldate{font-family:"IM Fell English",serif;font-size:15px;letter-spacing:.06em}
.ldate small{font-family:"Shippori Mincho B1",serif;font-size:11px;color:var(--ink-dim);margin-left:6px}
.lmeta{font-size:11px;color:var(--ink-dim);letter-spacing:.06em}
.spec{display:grid;grid-template-columns:14px 4.6em 1fr 20px;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.sw{width:11px;height:11px;border-radius:50%;border:1px solid rgba(216,204,180,.5)}
.sw.none{background:none;border-style:dashed;border-color:rgba(216,204,180,.3)}
.spec b{font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spec .wd{color:var(--sepia);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spec .wd i{font-style:normal;color:var(--brass-dim);margin:0 3px}
.flower{width:20px;height:20px;overflow:visible}
.flower .petals{fill:rgba(181,142,138,.75);stroke:rgba(236,228,210,.35);stroke-width:.5}
.flower .heart{fill:var(--brass)}
.flower .stem{fill:none;stroke:#8a9a86;stroke-width:.8;stroke-linecap:round}
.flower .leaf{fill:rgba(138,154,134,.7)}
.ldetail{display:none;margin-top:6px;padding-top:6px;border-top:1px dashed rgba(176,148,87,.25)}
.label.open .ldetail{display:block}
.ldetail .d{font-size:12px;color:var(--ink-dim);padding:3px 0 3px 22px;white-space:pre-wrap}
.ldetail .d b{color:var(--ink);font-weight:500;margin-right:6px}
.ldetail .foot{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--ink-dim)}
.ldetail .del{font-size:11px;color:var(--rose);border-bottom:1px solid rgba(181,142,138,.4)}

/* ---------- 標本棚（分析） ---------- */
.stat{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat div+div{border-left:1px solid rgba(176,148,87,.2)}
.stat b{display:block;font-size:26px;color:var(--brass);font-weight:500;font-family:"IM Fell English",serif;line-height:1.2}
.stat span{font-size:11px;color:var(--ink-dim);letter-spacing:.1em}
.figs{display:flex;justify-content:center;gap:6px}
.figs figure{text-align:center}
.figs svg{height:min(46vh,300px);width:auto;display:block}
.figs figcaption{font-family:"IM Fell English",serif;font-style:italic;font-size:11px;color:var(--ink-dim);letter-spacing:.15em}
.body-line{fill:none;stroke:rgba(216,204,180,.45);stroke-width:.8;stroke-linecap:round;stroke-linejoin:round}
.spot{cursor:pointer}
.spot .hit{fill:transparent}
.spot.sel .core{stroke:var(--ink);stroke-width:1}
.pinfo{text-align:center;font-size:13px;min-height:1.8em;margin-top:6px}
.pinfo b{letter-spacing:.1em;margin-right:8px}
.pinfo span{color:var(--ink-dim);font-size:12px}
.others{text-align:center;font-size:12px;color:var(--ink-dim);margin-top:4px}
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 14px;padding:4px 0}
.cloud span{line-height:1.5;letter-spacing:.04em}
.swatches{display:flex;flex-wrap:wrap;gap:10px 16px}
.swatches div{display:flex;align-items:center;gap:7px;font-size:13px}
.swatches .sw{width:16px;height:16px}
.swatches small{color:var(--ink-dim);font-size:11px}
.tubes{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end;text-align:center}
.tube{position:relative;margin:0 auto;width:10px;height:84px;border:1px solid rgba(216,204,180,.35);border-radius:5px;overflow:hidden;background:rgba(233,228,214,.04)}
.tube i{position:absolute;left:2px;right:2px;bottom:2px;border-radius:3px;background:linear-gradient(90deg,#8d989a,#f1f2ee 45%,#7c8688)}
.tubes .v{font-size:12px;font-family:"IM Fell English",serif;height:1.4em}
.tubes .w{font-size:10px;color:var(--ink-dim);margin-top:4px;white-space:nowrap}

/* ---------- ダイアログ ---------- */
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(10,14,12,.7);padding:16px}
.modal.on{display:flex}
.modal .panel{max-width:420px;width:100%}
</style>

<body>
<div class="bg" id="bg"></div>
<div class="grain"></div>

<!-- タイトル -->
<section class="screen on" id="title" onclick="go('main')">
  <h1>感覚標本室</h1>
  <div class="en">— a conservatory of quiet senses —</div>
  <div class="tap">画面に触れて、はじめる</div>
</section>

<!-- メイン -->
<section class="screen" id="main">
  <!-- 上部バー -->
  <header class="hud">
    <div class="plate">感覚標本室<span id="syncDot" class="dot"></span></div>
  </header>
  <!-- 左端の見出し札：押すと目録（引き出し）が滑り出る -->
  <button class="idxtab" style="display:none" onclick="openDrawer()" aria-label="目録をひらく"><span>目</span><span>録</span></button>
  <div class="dock">
    <button class="dive" onclick="startSelect()"><span class="ring"></span><b>採集する</b><small>Focusing</small></button>
    <div class="brass speech" onclick="nextTalk()"><span class="name">黒百合</span><p id="greet"></p><span class="next">▼</span></div>
    <div class="sync" id="syncState"></div>
  </div>
</section>

<!-- 部位選択 -->
<section class="screen" id="select">
  <div class="wrap">
    <div class="head"><h2>採集</h2><button class="back" onclick="go('main')">← 戻る</button></div>
    <button class="brass openstart" onclick="beginSession(true)">
      <b>わからないまま、はじめる</b>
      <span>黒百合が頭から足先まで順に案内する。引っかかった場所から採集していく。</span>
    </button>
    <div class="or"><span>あるいは、場所が決まっているなら</span></div>
    <div class="brass panel">
      <div id="partChips"></div>
      <div class="addrow"><input class="field" id="partInput" placeholder="ほかの場所（例：左の耳元）" maxlength="20"><button class="btn ghost" onclick="addPart()">加える</button></div>
      <p class="hint" id="selCount"></p>
    </div>
    <button class="btn primary" style="width:100%" id="beginBtn" onclick="beginSession(false)" disabled>この順に採集する</button>
  </div>
</section>

<!-- セッション -->
<section class="screen" id="session">
  <div class="wrap" style="display:flex;flex-direction:column;flex:1">
    <div class="head"><div><div class="partname" id="sPart"></div><div class="counter" id="sCounter"></div></div></div>
    <div class="steps" id="sSteps"><span></span><span></span><span></span><span></span></div>

    <div class="brass panel" id="sBody"></div>

</section>

<!-- 設定 -->
<div class="modal" id="settings">
  <div class="brass panel">
    <h3>保存先（PocketBase）</h3>
    <p class="muted" style="margin-bottom:10px">正本は PocketBase の <code>fukaimi_sessions</code>。この端末の記録はキャッシュと送信待ちの控えです。</p>
    <input class="field" id="pbUrl" style="width:100%" placeholder="http://100.121.46.56:8090">
    <p class="hint" id="pbTest"></p>
    <div class="row">
      <button class="btn ghost" onclick="closeSettings()">閉じる</button>
      <button class="btn primary" onclick="saveSettings()">保存して同期</button>
    </div>
  </div>

<script>
/* =========================================================
   データ層：正本は PocketBase、localStorage はキャッシュ＋送信待ち
   ========================================================= */
const COLL = 'fukaimi_sessions';
const K = {url:'fukaimi_pb_url', cache:'fukaimi_cache', pending:'fukaimi_pending', sound:'fukaimi_sound'};
const DEFAULT_URL = 'http://100.121.46.56:8090';

function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

const store = {
  url: lsGet(K.url, DEFAULT_URL),
  sessions: lsGet(K.cache, []),      // 表示用キャッシュ
  pending: lsGet(K.pending, []),     // PocketBase 未送信の session_id
  online: null,
};
function persist(){ lsSet(K.cache, store.sessions); lsSet(K.pending, store.pending); }

async function pb(path, opt={}){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), 6000);
  try{
    const r = await fetch(store.url.replace(/\/$/,'') + path, {...opt, signal:ctl.signal,
      headers:{'Content-Type':'application/json', ...(opt.headers||{})}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.status===204 ? null : r.json();
  } finally { clearTimeout(t); }
}
const q = s => encodeURIComponent(s);

// 送信待ちを流す。session_id で既存確認してから作成＝再送で重複しない
async function flush(){
  for(const sid of [...store.pending]){
    const s = store.sessions.find(x=>x.session_id===sid);
    if(!s){ store.pending = store.pending.filter(x=>x!==sid); continue; }
    const body = JSON.stringify({session_id:s.session_id, started_at:s.started_at, ended_at:s.ended_at, entries:s.entries});
    const found = await pb(`/api/collections/${COLL}/records?perPage=1&filter=${q(`session_id="${sid}"`)}`);
    if(found.items.length) await pb(`/api/collections/${COLL}/records/${found.items[0].id}`, {method:'PATCH', body});
    else await pb(`/api/collections/${COLL}/records`, {method:'POST', body});
    store.pending = store.pending.filter(x=>x!==sid);
    persist();
  }
}
// 正本を読み直してキャッシュを置き換える（送信待ちはローカル版を残す）
async function pull(){
  let page = 1, items = [];
  while(true){
    const r = await pb(`/api/collections/${COLL}/records?perPage=200&page=${page}&sort=-started_at`);
    items = items.concat(r.items);
    if(page >= r.totalPages) break; page++;
  }
  const remote = items.map(x=>({session_id:x.session_id, started_at:x.started_at, ended_at:x.ended_at, entries:x.entries||[], _id:x.id}));
  const local = store.sessions.filter(s=>store.pending.includes(s.session_id));
  const ids = new Set(local.map(s=>s.session_id));
  store.sessions = [...local, ...remote.filter(s=>!ids.has(s.session_id))]
    .sort((a,b)=>b.started_at.localeCompare(a.started_at));
  persist();
}
async function sync(){
  try{ await flush(); await pull(); store.online = true; }
  catch(e){ store.online = false; console.warn('sync', e); }
  showSync();
}
function showSync(){
  const el = document.getElementById('syncState');
  const n = store.pending.length;
  document.getElementById('syncDot').className = 'dot' + (store.online===null ? '' : store.online && !n ? ' ok' : ' ng');
  el.textContent = store.online===null ? '同期中…'
    : store.online ? (n ? `送信待ち ${n}件` : '温室の記録と同期済み')
    : `保存先に届かず・この端末に控え${n?`（送信待ち ${n}件）`:''}`;
}
async function saveSession(s){
  const i = store.sessions.findIndex(x=>x.session_id===s.session_id);
  if(i>=0) store.sessions[i] = s; else store.sessions.unshift(s);
  if(!store.pending.includes(s.session_id)) store.pending.push(s.session_id);
  persist(); await sync();
}
async function deleteSession(sid){
  if(!confirm('この記録を消しますか？（保存先からも消えます）')) return;
  const s = store.sessions.find(x=>x.session_id===sid);
  try{
    const found = await pb(`/api/collections/${COLL}/records?perPage=1&filter=${q(`session_id="${sid}"`)}`);
    if(found.items.length) await pb(`/api/collections/${COLL}/records/${found.items[0].id}`, {method:'DELETE'});
  }catch(e){
    if(!store.pending.includes(sid)){ alert('保存先に届かないため、今は消せません。'); return; }
  }
  store.sessions = store.sessions.filter(x=>x!==s);
  store.pending = store.pending.filter(x=>x!==sid);
  persist(); renderHistory();
}

/* ---------- 目録（引き出し） ---------- */
function openDrawer(){ document.body.classList.add('drawer-open'); document.getElementById('drawer').setAttribute('aria-hidden','false'); document.getElementById('drawerSync').textContent = document.getElementById('syncState').textContent; }
function closeDrawer(){ document.body.classList.remove('drawer-open'); document.getElementById('drawer').setAttribute('aria-hidden','true'); }
function drawerGo(fn){ closeDrawer(); setTimeout(fn, 260); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDrawer(); });
// 左へ払って閉じる／画面左端から右へ払って開く（ホームのみ）
(function(){
  let x0=null, y0=0;
  document.addEventListener('touchstart', e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; }, {passive:true});
  document.addEventListener('touchend', e=>{
    if(x0===null) return; const t=e.changedTouches[0], dx=t.clientX-x0, dy=Math.abs(t.clientY-y0);
    const open = document.body.classList.contains('drawer-open');
    if(open && dx < -50 && dy < 60) closeDrawer();
    else if(!open && x0 < 24 && dx > 60 && dy < 60 && document.getElementById('main').classList.contains('on')) openDrawer();
    x0=null;
  }, {passive:true});
})();

// 黒百合の台詞（外面＝紳士的・硬質・やや古風。一人称「私」、二人称「かすみ／お前」）
// 挨拶(g)は時間帯が変わるまで一度きり。台詞枠を押すと、挨拶ではない語り(t)を順に送る

  {until:17, g:['来たか。午後の温室は、ちょうどいい温度だ。'],
   t:['急がなくていい。ここでは何ひとつ、判断しなくていい。','——かすみ、お前はどこが一番、黙り込んでいると思う？','紅茶が冷めるまでの間だけでも構わない。座りたまえ。']},
  {until:19, g:['おかえり、かすみ。'],

  {until:22, g:['おかえり。夜は壁が薄くなる時間だ。'],

];
// 時間帯を問わず使える語り（時間帯の語りと混ぜて送る）
const TALK_ANY = [
  'この温室の植物は、急かされると枯れる。\nお前も、たいして変わらない。',
  '身体の声というのは、大抵ひどく小さい。\n聞こえないのは、お前が鈍いからではない。周りが騒がしすぎるだけだ。',
  '標本棚が少しずつ埋まっていくのを見るのは、悪くない。\n……私の趣味の話だ。気にしなくていい。',
  '「わからない」と言えるうちは、まだ大丈夫だ。\n本当に危ういのは、わかったふりを始めた時だ。',
  '肩に力が入っている。\n……気づいていなかったかね？ 私は、最初から気づいていたが。',
  '無理に何かを見つけようとしなくていい。\n何も起きない日の記録も、私にとっては等しく価値がある。',
  '硝子越しの光は、直に浴びるより柔らかい。\n人の言葉も、少し距離を置いて受け取るくらいが丁度いい。',
  'お前の言葉選びは、時々ひどく面白い。\n「ぶにぐち」など、どの辞書にも載っていないだろう。',
  '苦しいものを、苦しいまま置いておける場所が一つあればいい。\nここがそうであれば、私は満足だ。',
  'ここに来る理由は、何でも構わない。\n暇つぶしでも、逃げ場所でも。',
];
const talkState = {slot:-1, order:[], i:0};
function shuffle(a){ a = [...a]; for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
// ホームに来たとき：時間帯が変わっていれば挨拶＋語りひとつ。同じ時間帯なら前の台詞のまま
function greet(){
  const h = new Date().getHours(), slot = TALK.findIndex(x=>h < x.until), T = TALK[slot];
  if(slot === talkState.slot) return false;
  talkState.slot = slot; talkState.order = shuffle([...T.t, ...TALK_ANY]); talkState.i = 0;
  const g = T.g[Math.floor(Math.random()*T.g.length)];
  document.getElementById('greet').textContent = g + '\n' + talkState.order[0].replace('\n','');
  return true;
}
// 台詞枠を押したとき：挨拶はせず、語りを一つ送る（一巡したら並べ直す）
function nextTalk(){
  if(greet()) return;
  const o = talkState.order;
  talkState.i++;
  if(talkState.i >= o.length){ const last = o[o.length-1]; talkState.order = shuffle(o); if(talkState.order[0]===last) talkState.order.reverse(); talkState.i = 0; }
  document.getElementById('greet').textContent = talkState.order[talkState.i];
}

const PART_GROUPS = [
  ['頭',   ['額','目の奥','後頭部']],
  ['首',   ['顎','喉','首']],
  ['胸・腹', ['胸','みぞおち','お腹']],
  ['背',   ['肩','背中','脇']],
  ['腰・肢', ['腰','手','脚']],

function partTags(picked, withNo){
  const extra = picked.filter(p=>!PARTS.includes(p));
  const groups = extra.length ? [...PART_GROUPS, ['その他', extra]] : PART_GROUPS;
  return groups.map(([g,ps])=>`<div class="pgroup"><span class="g">${g}</span><div class="tags">${
    ps.map(p=>{ const i = picked.indexOf(p);
      return `<button class="tag ${i>=0?'sel':''}" data-p="${esc(p)}">${esc(p)}${withNo && i>=0?`<span class="no">${i+1}</span>`:''}</button>`; }).join('')
  }</div></div>`).join('');
}
function renderChips(){
  const el = document.getElementById('partChips');
  el.innerHTML = partTags(selected, true);
  el.querySelectorAll('.tag').forEach(b=>b.onclick=()=>togglePart(b.dataset.p));
  document.getElementById('selCount').textContent = selected.length
    ? `${selected.join(' → ')}（${selected.length}/3）` : '多くても三つまで。選んだ順にたどる。';
  document.getElementById('beginBtn').disabled = !selected.length;
}
function togglePart(p){
  if(selected.includes(p)) selected = selected.filter(x=>x!==p);
  else if(selected.length<3) selected.push(p);
  renderChips();
}
function addPart(){
  const el = document.getElementById('partInput'); const v = el.value.trim();
  if(v && !selected.includes(v) && selected.length<3){ selected.push(v); el.value=''; }

}

function shallow(){

}
function toBeach(){
  // 外へ出る：即終了。途中でも記録は残す
  saveFields();
  if(S.cur.body_part && (S.step>0 || S.cur.noticed || S.cur.sensation_words.length)) commitEntry(false);
  finish('beach');
}
function checkIn(){
  if(!S || !document.getElementById('session').classList.contains('on')) return;
  const el = document.getElementById('sLine');
  el.textContent = '……かすみ、少し様子を聞かせてくれ。\n息はしやすいかね？ 苦しさや怖さがあるなら、迷わず「扉のそばへ」か「外へ出る」だ。\n\n' + el.textContent;
}
async function finish(kind){
  clearInterval(checkTimer);
  S.ended_at = new Date().toISOString();
  const rec = {session_id:S.session_id, started_at:S.started_at, ended_at:S.ended_at, entries:S.entries};
  const lines = {
    shift:'よく採ってきた、かすみ。確かに動いたな。\n溜まっていたものは、もう外に出ている。今はそのまま、緩んでいたまえ。',
    rest:'ご苦労だった。\n動かない日があるのは、身体がお前を守っている証拠だ。恥じることは何もない。',
    shallow:'よく戻ってきた。\n水を一杯飲んできたまえ。……いや、私が持ってこよう。そこに座っていたまえ。',
    beach:'外の空気だ。ここはもう安全だ。\n足の裏で床の感触を確かめたまえ。……そう。おかえり、かすみ。',
  };
  document.getElementById('doneLine').textContent = lines[kind];
  document.getElementById('doneSummary').innerHTML = S.entries.length
    ? '<h3>今日の標本</h3>' + entryList(S.entries) : '<p class="muted">標本にするほどは採らなかったか。それでいい。</p>';
  go('done');
  if(S.entries.length) await saveSession(rec);
  S = null;
}

/* =========================================================
   呼吸法：水銀柱＋メトロノーム
   ========================================================= */
(function drawTicks(){
  // 右に目盛と華氏風の数字、左は細い副目盛だけ
  const g = document.getElementById('ticks'); let h='';
  for(let i=0;i<=40;i++){
    const y = 372 - i*8, major = i%10===0, mid = i%5===0;
    h += `<line x1="70" y1="${y}" x2="${major?84:mid?80:75}" y2="${y}" stroke-opacity="${major?1:.6}"/>`;
    if(mid) h += `<line x1="44" y1="${y}" x2="50" y2="${y}" stroke-opacity=".45"/>`;
    if(major) h += `<text x="89" y="${y+3.5}" font-size="10" font-family="IM Fell English,serif" font-style="italic" stroke="none">${50+i}</text>`;
  }
  g.innerHTML = h;
})();
let bState = {run:false, raf:0, t0:0, pat:[4,0,6,0], min:5, sound:lsGet(K.sound,true)};
let actx = null;
const PHASES = [['吸う','ゆっくり','inhale'],['留める','そのまま','hold'],['吐く','細く、長く','exhale'],['留める','空のまま','rest']];
function segInit(id, cb){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{
    document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.toggle('on', x===b)); cb(b);
  });
}
segInit('bPattern', b=>bState.pat = b.dataset.p.split(',').map(Number));
segInit('bLen', b=>bState.min = +b.dataset.m);
function renderSoundBtn(){ document.querySelectorAll('#bSoundSeg button').forEach(b=>b.classList.toggle('on', (b.dataset.s==='1')===bState.sound)); }
segInit('bSoundSeg', b=>{ bState.sound = b.dataset.s==='1'; lsSet(K.sound, bState.sound); });
renderSoundBtn();
function tick(accent){
  if(!bState.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type='sine'; o.frequency.value = accent ? 660 : 440;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(accent?.22:.08, t+.005); g.gain.exponentialRampToValueAtTime(.0001, t+(accent?.6:.18));
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.7);
  }catch(e){}
}
function setMercury(f){ // 0..1
  const top = 372 - f*320, el = document.getElementById('mercury');
  el.setAttribute('y', top); el.setAttribute('height', 402-top);
  document.getElementById('hgGlow').setAttribute('cy', top);
}
function toggleBreath(){ bState.run ? stopBreath() : startBreath(); }
function openBreath(){
  document.getElementById('breath').classList.remove('insession');
  document.getElementById('bTitle').textContent = '呼吸';
  bState.onDone = null; go('breath');
}
// 採集前の支度：4–6 のリズムで3分。終わったら onDone
function sessionBreath(onDone){
  stopBreath();
  document.getElementById('breath').classList.add('insession');
  document.getElementById('bTitle').textContent = '支度の呼吸';
  document.getElementById('bGuide').textContent = '音が鳴ったら吸い、次の音で吐く。\n数えるのは私の役目だ。';
  bState.saved = {pat:bState.pat, min:bState.min};
  bState.pat = [4,0,6,0]; bState.min = 3; bState.onDone = onDone;
  go('breath'); startBreath();
}
function startBreath(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){}
  bState.run = true; bState.t0 = performance.now(); bState.lastSec = -1; bState.lastPhase = -1;
  document.getElementById('bStartTxt').textContent = 'やめる';
  document.getElementById('bStart').classList.add('running');
  document.getElementById('bCtrl').classList.add('quiet');
  const loop = now => {
    if(!bState.run) return;
    const el = (now - bState.t0)/1000, total = bState.min*60;
    if(el >= total){ stopBreath(true); return; }
    const pat = bState.pat, cyc = pat.reduce((a,b)=>a+b,0);
    let t = el % cyc, ph = 0;
    while(t >= pat[ph] ){ t -= pat[ph]; ph = (ph+1)%4; }
    const f = t/pat[ph], ease = x => (1-Math.cos(Math.PI*x))/2;
    setMercury(ph===0 ? ease(f) : ph===1 ? 1 : ph===2 ? 1-ease(f) : 0);
    if(ph !== bState.lastPhase){ tick(true); bState.lastPhase = ph; bState.lastSec = Math.floor(el); }
    else if(Math.floor(el) !== bState.lastSec){ tick(false); bState.lastSec = Math.floor(el); }
    document.getElementById('bLabel').textContent = PHASES[ph][0];
    document.getElementById('bEn').textContent = PHASES[ph][2];
    document.getElementById('bSub').textContent = `${PHASES[ph][1]}　${Math.ceil(pat[ph]-t)}`;
    document.getElementById('bProg').style.width = (el/total*100) + '%';
    bState.raf = requestAnimationFrame(loop);
  };
  bState.raf = requestAnimationFrame(loop);
}
function stopBreath(done){
  bState.run = false; cancelAnimationFrame(bState.raf);
  document.getElementById('bStartTxt').textContent = 'はじめる';
  document.getElementById('bStart').classList.remove('running');
  document.getElementById('bCtrl').classList.remove('quiet');
  document.getElementById('bLabel').textContent = done ? '了' : '呼吸';
  document.getElementById('bEn').textContent = done ? 'fin.' : 'breathe';
  document.getElementById('bSub').textContent = done ? '水銀は静かに落ち着いた。……上出来だ' : '支度ができたら';
  document.getElementById('bProg').style.width = done ? '100%' : '0';
  setMercury(0);
  if(bState.saved){ bState.pat = bState.saved.pat; bState.min = bState.saved.min; bState.saved = null; }
  const cb = bState.onDone; bState.onDone = null;
  if(document.getElementById('breath').classList.contains('insession')){
    document.getElementById('breath').classList.remove('insession');
    document.getElementById('bTitle').textContent = '呼吸';
    if(done && cb) cb();
  }
}

/* =========================================================
   履歴
   ========================================================= */
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(iso){ const d = new Date(iso); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}  ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
// 色名 → 色見本（褪せた色調に寄せる）。知らない色名は名前から決まった褪せ色
const COLOR_WORDS = [
  ['赤銅','#9a5b3c'],['黄土','#b08a48'],['金','#b09457'],['銀','#b9bdb8'],['灰','#8a8a84'],['鼠','#8a8a84'],
  ['藍','#3f4f6e'],['紺','#34405c'],['青','#5f7896'],['水','#8fa9b5'],['緑','#6d8a68'],['苔','#6b7a4e'],['黄','#c7ad5e'],
  ['橙','#c0804a'],['オレンジ','#c0804a'],['桃','#c49a9a'],['ピンク','#c49a9a'],['紅','#9e4a4a'],['赤','#a65149'],
  ['茶','#7a5a42'],['紫','#7d6890'],['黒','#2a2a2a'],['白','#e6e1d4'],['透明','rgba(233,228,214,.25)'],
];
function colorOf(name){
  if(!name) return null;
  const hit = COLOR_WORDS.find(([w])=>name.includes(w)); if(hit) return hit[1];
  let h = 0; for(const c of name) h = (h*31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 22% 55%)`;
}
const FLOWER = '<svg class="flower" viewBox="0 0 20 20" aria-label="シフト"><title>シフト</title><path class="stem" d="M10 12.5C9.5 15 8 17.5 5.5 19"/><path class="leaf" d="M8.3 16.2C6 15.6 4.6 16.4 4 17.8c1.9.5 3.4 0 4.3-1.6z"/><g class="petals"><ellipse cx="10" cy="5.4" rx="2.5" ry="3.6" transform="rotate(0 10 9)"/><ellipse cx="10" cy="5.4" rx="2.5" ry="3.6" transform="rotate(72 10 9)"/><ellipse cx="10" cy="5.4" rx="2.5" ry="3.6" transform="rotate(144 10 9)"/><ellipse cx="10" cy="5.4" rx="2.5" ry="3.6" transform="rotate(216 10 9)"/><ellipse cx="10" cy="5.4" rx="2.5" ry="3.6" transform="rotate(288 10 9)"/></g><circle class="heart" cx="10" cy="9" r="1.7"/></svg>';
const WD = '日月火水木金土';
function specRows(es){
  return es.map(e=>{
    const c = colorOf(e.color);
    return `<div class="spec"><span class="sw ${c?'':'none'}" ${c?`style="background:${c}"`:''} title="${esc(e.color||'色なし')}"></span>
      <b>${esc(e.body_part)}</b><span class="wd">${e.sensation_words.map(esc).join('<i>→</i>') || '<span class="muted">言葉なし</span>'}</span>${e.shift_occurred?FLOWER:'<span></span>'}</div>`;
  }).join('');
}
function specDetails(es){
  return es.map(e=>`<div class="d"><b>${esc(e.body_part)}</b>${e.color?`色：${esc(e.color)}　`:''}問い ${e.asks||0}回　${e.shift_occurred?'シフト':'区切り'}${e.note?`\n${esc(e.note)}`:''}</div>`).join('');
}
function entryList(es){ return specRows(es); }
function renderHistory(){
  const el = document.getElementById('histList');
  if(!store.sessions.length){ el.innerHTML = '<div class="brass panel"><p class="muted">頁はまだ白紙だ。最初の一行は、お前が書きたまえ。</p></div>'; return; }
  let html = '', month = '';
  const byMonth = {};
  store.sessions.forEach(s=>{ const d = new Date(s.started_at), k = `${d.getFullYear()}年 ${d.getMonth()+1}月`; byMonth[k] = (byMonth[k]||0)+1; });
  store.sessions.forEach(s=>{
    const d = new Date(s.started_at), k = `${d.getFullYear()}年 ${d.getMonth()+1}月`;
    if(k!==month){ month = k; html += `<h3 class="month">${k}<span>${byMonth[k]}回</span></h3>`; }
    const sh = s.entries.filter(e=>e.shift_occurred).length;
    html += `<article class="label" data-sid="${esc(s.session_id)}">
      <div class="lhead"><span class="ldate">${d.getMonth()+1}.${d.getDate()}<small>（${WD[d.getDay()]}）${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</small></span>
        <span class="lmeta">${s.entries.length}点${sh?` · シフト${sh}`:''}${store.pending.includes(s.session_id)?' · 送信待ち':''}</span></div>
      ${specRows(s.entries)}
      <div class="ldetail">${specDetails(s.entries)}<div class="foot"><span>${fmt(s.started_at)}</span><button class="del">この記録を消す</button></div></div>
    </article>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('.label').forEach(a=>{
    a.onclick = e=>{ if(e.target.closest('.del')) return; a.classList.toggle('open'); };
    a.querySelector('.del').onclick = ()=>deleteSession(a.dataset.sid);
  });
}

/* =========================================================
   標本棚（分析）
   ========================================================= */
// 人体図：正面(front)と背面(back)。部位ごとの位置（左右あるものは2点）
const SPOTS = {
  '額':['f',[[60,15]]], '目の奥':['f',[[60,26]]], '顎':['f',[[60,43]]], '喉':['f',[[60,54]]],
  '肩':['f',[[35,67],[85,67]]], '胸':['f',[[60,80]]], 'みぞおち':['f',[[60,97]]], 'お腹':['f',[[60,119]]],
  '脇':['f',[[36,86],[84,86]]], '手':['f',[[22,158],[98,158]]], '脚':['f',[[48,205],[72,205]]],
  '後頭部':['b',[[60,24]]], '首':['b',[[60,52]]], '背中':['b',[[60,88]]], '腰':['b',[[60,128]]],
};
const BODY = `<ellipse class="body-line" cx="60" cy="27" rx="15" ry="19"/>
  <path class="body-line" d="M54 45v12M66 45v12"/>
  <path class="body-line" d="M54 57C42 59 34 62 31 71L34 110Q36 136 39 146H81Q84 136 86 110L89 71C86 62 78 59 66 57"/>
  <g><path class="body-line" d="M31 71C25 77 23 96 22 120L19 150M35 88 32 122 28 150"/><ellipse class="body-line" cx="23.5" cy="157" rx="5" ry="7"/></g>
  <g transform="translate(120 0) scale(-1 1)"><path class="body-line" d="M31 71C25 77 23 96 22 120L19 150M35 88 32 122 28 150"/><ellipse class="body-line" cx="23.5" cy="157" rx="5" ry="7"/></g>
  <path class="body-line" d="M39 146 42 200 44 250H55L57 200 59 152Q60 149 61 152L63 200 65 250H76L78 200 81 146"/>`;
function bodyFig(side, counts, max){
  let spots = '';
  Object.entries(SPOTS).forEach(([p,[sd,pts]])=>{
    if(sd!==side) return;
    const n = counts.get(p)||0, t = n/max;
    pts.forEach(([x,y])=>{
      spots += `<g class="spot" data-p="${p}"><circle class="hit" cx="${x}" cy="${y}" r="11"/>`
        + (n ? `<circle cx="${x}" cy="${y}" r="${6+8*t}" fill="url(#heatG)" opacity="${(.35+.65*t).toFixed(2)}"/><circle class="core" cx="${x}" cy="${y}" r="2.2" fill="#d8c08a"/>`
             : `<circle class="core" cx="${x}" cy="${y}" r="1.6" fill="none" stroke="rgba(216,204,180,.35)" stroke-width=".7"/>`) + '</g>';
    });
  });
  return `<svg viewBox="0 0 120 256" role="img" aria-label="${side==='f'?'正面':'背面'}の部位図">
    <defs><radialGradient id="heatG"><stop offset="0" stop-color="#d4b872" stop-opacity=".95"/><stop offset=".6" stop-color="#b09457" stop-opacity=".45"/><stop offset="1" stop-color="#b09457" stop-opacity="0"/></radialGradient></defs>
    ${BODY}${spots}</svg>`;
}
function weekStart(d){ d = new Date(d); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d; }
function kuroyuriNote(es, shifts){
  const now = Date.now(), day = 864e5;
  const recent = store.sessions.filter(s=>now - new Date(s.started_at) < 7*day).length;
  if(!recent) return 'この一週間、温室の扉は閉じたままだった。\n……責めてはいない。気が向いたら来たまえ。';
  const m = new Map();
  es.filter(e=>now - new Date(e.at) < 14*day).forEach(e=>m.set(e.body_part,(m.get(e.body_part)||0)+1));
  const top = [...m].sort((a,b)=>b[1]-a[1])[0];
  if(top && top[1]>=3) return `最近、${top[0]}ばかり訪れているな。\n……何か、そこに置き忘れているのではないかね。`;
  const rate = Math.round(shifts.length/es.length*100);
  if(es.length>=5 && rate>=70) return `シフトの率は${rate}%。\n身体はお前が思うより、ずっと素直に口を開いているようだ。`;
  return `標本は${es.length}点になった。\n並べてみると、お前の身体の癖が少しずつ見えてくる。`;
}
function renderStats(){
  const el = document.getElementById('statsBody');
  const es = store.sessions.flatMap(s=>s.entries.map(e=>({...e, at:s.started_at})));
  if(!es.length){ el.innerHTML = '<div class="brass panel"><p class="muted">標本棚はまだ空だ。幾度か採集を重ねれば、お前の身体の癖が見えてくる。</p></div>'; return; }
  const count = arr => { const m = new Map(); arr.forEach(k=>m.set(k,(m.get(k)||0)+1)); return m; };
  const sorted = m => [...m].sort((a,b)=>b[1]-a[1]);
  const shifts = es.filter(e=>e.shift_occurred);
  const avg = shifts.length ? (shifts.reduce((a,e)=>a+(e.asks||0),0)/shifts.length).toFixed(1) : '—';
  // 部位
  const pc = count(es.map(e=>e.body_part)), maxP = Math.max(...pc.values());
  const others = sorted(pc).filter(([p])=>!SPOTS[p]);
  // 言葉
  const wc = sorted(count(es.flatMap(e=>e.sensation_words))).slice(0,18), maxW = wc.length ? wc[0][1] : 1;
  const cloud = wc.map(([w,n],i)=>{ const t = n/maxW;
    return `<span title="${esc(w)}：${n}回" style="font-size:${(12+14*t).toFixed(1)}px;color:${i<3?'var(--brass)':'var(--ink)'};opacity:${(.55+.45*t).toFixed(2)}">${esc(w)}</span>`; })
    .join('');
  // 色
  const cc = sorted(count(es.filter(e=>e.color).map(e=>e.color))).slice(0,10);
  // 週ごとのシフト（直近8週、空の週も0で表示）
  const w0 = weekStart(Date.now()), weeks = [];
  for(let i=7;i>=0;i--){ const d = new Date(w0); d.setDate(d.getDate()-7*i); weeks.push([d,0]); }
  shifts.forEach(e=>{ const k = weekStart(e.at).getTime(); const w = weeks.find(([d])=>d.getTime()===k); if(w) w[1]++; });
  const maxWk = Math.max(1, ...weeks.map(w=>w[1]));
  el.innerHTML = `
    <div class="brass speech"><span class="name">黒百合</span><p>${esc(kuroyuriNote(es, shifts))}</p></div>
    <div class="brass panel"><div class="stat">
      <div><b>${store.sessions.length}</b><span>採集</span></div>
      <div><b>${shifts.length}</b><span>シフト</span></div>
      <div><b>${avg}</b><span>問いの平均</span></div>
    </div></div>
    <div class="brass panel"><h3>訪れた場所</h3>
      <div class="figs"><figure>${bodyFig('f', pc, maxP)}<figcaption>front</figcaption></figure><figure>${bodyFig('b', pc, maxP)}<figcaption>back</figcaption></figure></div>
      <div class="pinfo" id="pinfo"><span>光っている場所に触れると、詳細が出る</span></div>
      ${others.length ? `<div class="others">その他：${others.map(([p,n])=>`${esc(p)} ${n}`).join(' · ')}</div>` : ''}
    </div>
    ${wc.length ? `<div class="brass panel"><h3>感覚の言葉</h3><div class="cloud">${cloud}</div></div>` : ''}
    ${cc.length ? `<div class="brass panel"><h3>色</h3><div class="swatches">${cc.map(([c,n])=>`<div><span class="sw" style="background:${colorOf(c)}"></span>${esc(c)}<small>×${n}</small></div>`).join('')}</div></div>` : ''}
    <div class="brass panel"><h3>週ごとのシフト</h3><div class="tubes">${weeks.map(([d,n])=>`<div title="${d.getMonth()+1}/${d.getDate()}の週：シフト${n}回"><div class="v">${n||''}</div><div class="tube"><i style="height:${n?Math.max(6,n/maxWk*78):0}px"></i></div><div class="w">${d.getMonth()+1}/${d.getDate()}</div></div>`).join('')}</div></div>`;
  el.querySelectorAll('.spot').forEach(g=>g.onclick=()=>{
    const p = g.dataset.p, n = pc.get(p)||0, sh = es.filter(e=>e.body_part===p && e.shift_occurred).length;
    el.querySelectorAll('.spot').forEach(x=>x.classList.toggle('sel', x.dataset.p===p));
    document.getElementById('pinfo').innerHTML = `<b>${esc(p)}</b><span>${n ? `${n}回 · シフト${sh}` : 'まだ訪れていない'}</span>`;
  });
}

greet(); showSync(); sync();
