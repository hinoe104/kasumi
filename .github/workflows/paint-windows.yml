name: Kasumi Paint (Windows build)

on:
  push:
    paths: ["paint/**", ".github/workflows/paint-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: paint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paint/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: paint/src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kasumi-paint-windows
          path: |
            paint/src-tauri/target/release/bundle/nsis/*.exe
            paint/src-tauri/target/release/bundle/msi/*.msi
