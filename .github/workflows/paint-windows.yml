name: Kasumi Paint (Windows build)

on:
  push:
    branches: [main, claude/paint-app]
    paths: ["paint/**", ".github/workflows/paint-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: paint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paint/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: paint/src-tauri
      - run: npm ci
      # every build gets a higher version so the in-app updater picks it up
      - name: Set version
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version='0.1.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: paint
          tagName: paint-v__VERSION__
          releaseName: Kasumi Paint v__VERSION__
          releaseBody: 最新版のインストーラです。アプリを入れてあれば、起動時に自動で更新を案内します。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
