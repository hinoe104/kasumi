<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kasumi Paint</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="menubar">
    <span class="brand">Kasumi Paint</span>
    <div class="group">
      <button data-cmd="new" title="新規 (Ctrl+N)">新規</button>
      <button data-cmd="open" title="開く (Ctrl+O)">開く</button>
      <button data-cmd="save" title="保存 (Ctrl+S)">保存</button>
      <button data-cmd="export" title="PNG書き出し (Ctrl+Shift+S)">書き出し</button>
    </div>
    <div class="group">
      <button data-cmd="undo" class="icon" title="元に戻す (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button data-cmd="redo" class="icon" title="やり直す (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    </div>
    <div class="group view">
      <button data-cmd="zoomOut" title="縮小 (-)">−</button>
      <span id="zoomLabel" title="ダブルクリックで全体表示">100%</span>
      <button data-cmd="zoomIn" title="拡大 (+)">+</button>
      <span id="rotLabel" title="クリックで回転リセット">0°</span>
      <button data-cmd="flipView" id="flipBtn" title="左右反転表示 (M)">反転</button>
    </div>
    <div class="spacer"></div>
    <div class="group windows" title="パレットの表示 (Tabで全部隠す)">
      <button data-win="tools">ツール</button>
      <button data-win="color">カラー</button>
      <button data-win="brush">ブラシ</button>
      <button data-win="layers">レイヤー</button>
    </div>
    <button data-cmd="theme" class="icon" title="テーマ切り替え">◐</button>
  </header>

  <div id="workspace">
    <div id="stage"><canvas id="view"></canvas></div>

    <div class="palette" data-palette="tools" id="toolsPalette">
      <div class="titlebar"><span>ツール</span></div>
      <div class="body">
        <button data-tool="brush" title="ブラシ (B)"><svg viewBox="0 0 24 24"><path d="M9.06 11.9 17.1 3.86a2.12 2.12 0 1 1 3 3L12.1 14.9"/><path d="M7.07 14.94C5.4 14.94 4 16.3 4 18c0 1.3-1.5 2-2.5 2 1.1 1.3 3 2 4.5 2a4 4 0 0 0 4-4c0-1.7-1.3-3.06-2.93-3.06z"/></svg></button>
        <button data-tool="eraser" title="消しゴム (E)"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
        <button data-tool="fill" title="塗りつぶし (G)"><svg viewBox="0 0 24 24"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg></button>
        <button data-tool="picker" title="スポイト (I / Alt)"><svg viewBox="0 0 24 24"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg></button>
        <button data-tool="hand" title="手のひら (H / Space)"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></button>
        <div class="swatches" title="描画色 / 背景色 (Xで入れ替え)">
          <div id="fg"></div><div id="bg"></div>
          <span class="swap"><svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M21 3 14 10"/><path d="M8 21H3v-5"/><path d="m3 21 7-7"/></svg></span>
        </div>
      </div>
    </div>

    <div class="palette" data-palette="color" style="width:236px">
      <div class="titlebar"><span>カラー</span></div>
      <div class="body">
        <canvas id="picker"></canvas>
        <div class="row"><input id="hex" spellcheck="false" maxlength="7" /><div id="recent"></div></div>
      </div>
    </div>

    <div class="palette" data-palette="brush" style="width:236px">
      <div class="titlebar"><span id="toolTitle">ブラシ</span></div>
      <div class="body" id="toolOptions">
        <div id="presets"></div>
        <div id="brushSliders"></div>
        <div id="fillOptions" hidden>
          <label class="slider"><span>許容誤差</span><input type="range" id="fillTol" min="0" max="100" value="10" /><output></output></label>
          <label class="slider"><span>領域拡張</span><input type="range" id="fillExpand" min="0" max="5" value="1" /><output></output></label>
          <label class="check"><input type="checkbox" id="fillMerged" checked /> 全レイヤーを参照</label>
        </div>
        <p id="noOptions" class="muted" hidden>このツールに設定はありません</p>
      </div>
    </div>

    <div class="palette" data-palette="layers" style="width:236px">
      <div class="titlebar"><span>レイヤー</span></div>
      <div class="body">
        <div class="row">
          <select id="blend"></select>
          <label class="slider compact"><input type="range" id="layerOpacity" min="0" max="100" /><output></output></label>
        </div>
        <label class="check"><input type="checkbox" id="lockAlpha" /> 透明部分を保護</label>
        <ul id="layerList"></ul>
        <div class="row buttons">
          <button data-cmd="addLayer" title="新規レイヤー (Ctrl+Shift+N)">＋</button>
          <button data-cmd="dupLayer" title="複製">⧉</button>
          <button data-cmd="mergeDown" title="下に結合 (Ctrl+E)">⤓</button>
          <button data-cmd="layerUp" title="上へ">▲</button>
          <button data-cmd="layerDown" title="下へ">▼</button>
          <button data-cmd="flipLayer" title="左右反転">⇋</button>
          <button data-cmd="clearLayer" title="消去 (Delete)">⌧</button>
          <button data-cmd="delLayer" title="削除">🗑</button>
        </div>
      </div>
    </div>
  </div>

  <footer id="status"><span id="statusDoc"></span><span id="statusPos"></span><span id="statusMsg"></span></footer>

  <dialog id="newDialog">
    <form method="dialog">
      <h2>新規キャンバス</h2>
      <div class="row">
        <label>幅 <input type="number" id="newW" min="1" max="10000" value="1920" /></label>
        <label>高さ <input type="number" id="newH" min="1" max="10000" value="1080" /></label>
      </div>
      <div class="row presets-size">
        <button type="button" data-size="1920x1080">FHD</button>
        <button type="button" data-size="2894x4093">A4 350dpi</button>
        <button type="button" data-size="1080x1080">正方形</button>
        <button type="button" data-size="1080x1920">縦長</button>
      </div>
      <div class="row end">
        <button value="cancel">キャンセル</button>
        <button value="ok" class="primary">作成</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
