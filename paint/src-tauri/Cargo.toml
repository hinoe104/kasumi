[package]
name = "kasumi-paint"
version = "0.1.0"
edition = "2021"

[lib]
name = "kasumi_paint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[profile.release]
lto = true
opt-level = 3
