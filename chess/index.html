<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はじめてのチェス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf9f4;
  --card:#ffffff;
  --line:rgba(184,146,62,.30);
  --gold:#b8923e;
  --gold-deep:#8f6f2b;
  --gold-bright:#d4af5e;
  --ink:#3b3450;
  --ink-dim:#7d7591;
  --lilac:#8f7fc4;
  --green:#4d9b74;
  --danger:#c05d5d;
  --sq-light:#f4ecdc;
  --sq-dark:#b7a7d4;
  --pc-white:#fffdf7;
  --pc-black:#2e2744;
  --wash-blue:rgba(148,183,214,.20);
  --wash-lilac:rgba(178,164,214,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1c1738; --card:#262046; --line:rgba(212,175,94,.28);
    --ink:#ece7f7; --ink-dim:#aaa2c2; --gold-deep:#d4af5e;
    --sq-light:#e9e0cc; --sq-dark:#9585bd;
    --wash-blue:rgba(148,183,214,.10); --wash-lilac:rgba(178,164,214,.10);
  }
}
:root[data-theme="dark"]{
  --paper:#1c1738; --card:#262046; --line:rgba(212,175,94,.28);
  --ink:#ece7f7; --ink-dim:#aaa2c2; --gold-deep:#d4af5e;
  --sq-light:#e9e0cc; --sq-dark:#9585bd;
  --wash-blue:rgba(148,183,214,.10); --wash-lilac:rgba(178,164,214,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Zen Kaku Gothic New",sans-serif;line-height:1.75;letter-spacing:.02em;
  min-height:100vh;
}
.sky{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(48% 34% at 88% 4%, var(--wash-blue) 0%, transparent 70%),
    radial-gradient(42% 30% at 4% 22%, var(--wash-lilac) 0%, transparent 70%),
    radial-gradient(50% 34% at 6% 86%, var(--wash-blue) 0%, transparent 70%);}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:24px 16px 64px}
header{text-align:center;margin-bottom:18px}
h1{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:clamp(24px,6vw,34px);letter-spacing:.08em}
header p{color:var(--ink-dim);font-size:14px}

.tabs{display:flex;justify-content:center;gap:6px;margin:0 auto 20px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;color:var(--ink-dim);font:inherit;font-weight:700;font-size:14px;padding:6px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--gold);color:#fff}

#play-area{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:820px){#play-area{grid-template-columns:1fr}}
@media (min-width:821px){.board-wrap{position:sticky;top:16px}}

/* ---------- 盤 ---------- */
.board-wrap{position:relative;width:100%;max-width:560px;margin:0 auto}
#arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.arrow{stroke-width:.17;stroke-linecap:round;opacity:.85}
.arrow.played{stroke:var(--gold)}
.arrow.best{stroke:var(--green)}
.arrow-head.played path{fill:var(--gold)}
.arrow-head.best path{fill:var(--green)}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;border-radius:10px;overflow:hidden;
  box-shadow:0 0 0 2px var(--gold),0 10px 30px rgba(59,52,80,.18);user-select:none;-webkit-user-select:none}
.sq{position:relative;border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Symbols","DejaVu Sans","Apple Symbols",serif;
  -webkit-tap-highlight-color:transparent}
.sq.light{background:var(--sq-light)}
.sq.dark{background:var(--sq-dark)}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(212,175,94,.38)}
.sq.selected::before{content:"";position:absolute;inset:0;background:rgba(212,175,94,.7)}
.sq.hint::before{content:"";position:absolute;inset:0;background:rgba(77,155,116,.45)}
.sq.move::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(59,52,80,.32)}
.sq.capture::after{content:"";position:absolute;inset:5%;border-radius:50%;border:5px solid rgba(59,52,80,.35)}
.sq.check{background:radial-gradient(circle,rgba(192,93,93,.95) 0%,rgba(192,93,93,.55) 45%,transparent 75%),var(--sq-light)}
.sq.dark.check{background:radial-gradient(circle,rgba(192,93,93,.95) 0%,rgba(192,93,93,.55) 45%,transparent 75%),var(--sq-dark)}
.sq.warn{box-shadow:inset 0 0 0 4px var(--danger)}
.pc{position:relative;z-index:1;font-size:min(9.5vw,52px);line-height:1;pointer-events:none}
.pc.w{color:var(--pc-white);-webkit-text-stroke:1.4px #3b3450;paint-order:stroke fill;text-shadow:0 2px 2px rgba(0,0,0,.18)}
.pc.b{color:var(--pc-black);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.coord{position:absolute;font-family:"Zen Kaku Gothic New",sans-serif;font-size:10px;font-weight:700;color:rgba(59,52,80,.55);z-index:1;pointer-events:none}
.coord.rank{top:2px;left:3px}
.coord.file{bottom:1px;right:4px}

/* ---------- サイド ---------- */
.side{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-family:"Shippori Mincho B1",serif;font-size:15px;color:var(--gold-deep);margin-bottom:8px;letter-spacing:.1em}

#guide{position:relative;border-left:4px solid var(--lilac)}
#guide[data-tone="warn"]{border-left-color:var(--danger)}
#guide[data-tone="good"]{border-left-color:var(--green)}
#guide[data-tone="hint"]{border-left-color:var(--green)}
.guide-name{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--lilac);margin-bottom:4px}
#guide-text{font-size:15px;min-height:4.5em}
.sub{color:var(--ink-dim);font-size:13px}
#guide-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.small{font-size:12px;padding:3px 10px;margin-top:6px}
.btn:focus-visible,.tabs button:focus-visible,.sq:focus-visible,.chip:focus-visible,.seg button:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row .label{font-size:13px;color:var(--ink-dim);min-width:4em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:none;color:var(--ink);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lilac);color:#fff}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--lilac)}

#puzzle-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:inherit;font-weight:700;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.chip.solved{background:rgba(77,155,116,.18);border-color:var(--green)}
.chip.current{box-shadow:0 0 0 2px var(--gold)}

/* ---------- 振り返り ---------- */
#review-panel h3{font-size:14px;margin:10px 0 4px}
#review-panel p{margin-bottom:6px;font-size:14px}
.why{font-size:14px}
.tip{background:var(--paper);border-radius:10px;padding:8px 10px}
.turning{list-style:none;display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.link{font:inherit;font-size:14px;font-weight:700;background:none;border:0;color:var(--gold-deep);text-decoration:underline;cursor:pointer;padding:0}
.tag{font-weight:700}
.tag.blunder{color:var(--danger)} .tag.mistake{color:#b9773a} .tag.good{color:var(--green)} .tag.mate{color:var(--lilac)}
.graph-wrap{position:relative;margin-top:6px}
.graph-wrap svg{display:block;width:100%;height:110px;background:var(--paper);border-radius:8px;cursor:pointer}
.graph-wrap .zero{stroke:var(--ink-dim);stroke-dasharray:3 3;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.6}
.graph-wrap .eval{fill:none;stroke:var(--lilac);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.graph-wrap .cursor{stroke:var(--gold);stroke-width:2;vector-effect:non-scaling-stroke}
.graph-wrap circle{stroke:var(--paper);stroke-width:2;vector-effect:non-scaling-stroke}
.dot-mine{fill:var(--danger);background:var(--danger)}
.dot-ai{fill:var(--green);background:var(--green)}
.axis{position:absolute;left:6px;font-size:11px;color:var(--ink-dim);pointer-events:none}
.axis.top{top:2px} .axis.bottom{bottom:2px}
.graph-tip{position:absolute;top:-26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12px;padding:2px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-dim);margin-top:4px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
#review-moves{display:grid;grid-template-columns:2.6em 1fr 1fr;gap:2px 4px;max-height:220px;overflow:auto;margin-top:10px;font-size:14px}
#review-moves .num{color:var(--ink-dim);text-align:right;padding:3px 4px 0 0}
.mv{font:inherit;text-align:left;background:none;border:0;border-radius:6px;padding:2px 6px;color:var(--ink);cursor:pointer}
.mv.player{font-weight:700}
.mv.blunder{color:var(--danger)} .mv.mistake{color:#b9773a}
.mv.ai.blunder,.mv.ai.mistake{color:var(--green)}
.mv.current{background:rgba(212,175,94,.35)}
.record-actions{margin-top:6px}

/* ---------- 記録 ---------- */
#records{max-width:680px;margin:0 auto}
#records-list{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.record{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.record-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.result{font-weight:700;padding:0 8px;border-radius:6px;font-size:13px}
.result.win{background:rgba(77,155,116,.18);color:var(--green)}
.result.loss{background:rgba(192,93,93,.15);color:var(--danger)}
.result.draw{background:rgba(143,127,196,.18);color:var(--lilac)}
details{margin-top:6px}
summary{cursor:pointer;font-size:13px;color:var(--ink-dim)}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:var(--paper);padding:8px;border-radius:8px;margin-top:6px}
.back{display:block;text-align:center;margin-top:32px;font-size:13px;color:var(--gold-deep)}
</style>
</head>
<body>
<div class="sky"></div>
<main>
  <header>
    <h1>はじめてのチェス</h1>
    <p>ガイドといっしょに、AI と1局。</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="モード">
    <button type="button" role="tab" data-tab="game" aria-selected="true">AI と対局</button>
    <button type="button" role="tab" data-tab="puzzle" aria-selected="false">1手詰め練習</button>
    <button type="button" role="tab" data-tab="records" aria-selected="false">記録</button>
  </nav>

  <section id="play-area">
    <div class="board-wrap">
      <div id="board" role="grid" aria-label="チェス盤"></div>
      <svg id="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg>
    </div>

    <div class="side">
      <div class="card" id="guide" data-tone="info" aria-live="polite">
        <div class="guide-name">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          ガイド
        </div>
        <div id="guide-text"></div>
        <div id="guide-actions"></div>
      </div>

      <div class="card" id="game-setup">
        <h2>対局の設定</h2>
        <div class="row">
          <span class="label">あなた</span>
          <span class="seg">
            <button type="button" data-color="w">白（先手）</button>
            <button type="button" data-color="b">黒（後手）</button>
          </span>
        </div>
        <div class="row">
          <span class="label">AI</span>
          <span class="seg">
            <button type="button" data-level="hiyoko">ひよこ</button>
            <button type="button" data-level="usagi">うさぎ</button>
            <button type="button" data-level="kitsune">きつね</button>
          </span>
        </div>
        <div class="row">
          <label class="switch"><input type="checkbox" id="guide-toggle"> 指す前にガイドが注意してくれる</label>
        </div>
        <button type="button" class="btn primary" id="new-game">この設定で新しく始める</button>
      </div>

      <div class="card" id="review-panel" hidden>
        <h2>まとめ</h2>
        <div id="review-summary"></div>
        <div id="review-graph"></div>
        <div id="review-moves"></div>
      </div>

      <div class="card" id="puzzle-setup" hidden>
        <h2>1手詰め</h2>
        <div class="sub" id="puzzle-progress"></div>
        <div id="puzzle-list"></div>
      </div>
    </div>
  </section>

  <section id="records" hidden>
    <div class="card">
      <h2>これまでの対局</h2>
      <p class="sub" id="records-summary"></p>
    </div>
    <ul id="records-list"></ul>
  </section>

  <a class="back" href="../">← かすみのページへ</a>
</main>

<script src="vendor/chess.js"></script>
<script src="ai.js"></script>
<script src="guide.js"></script>
<script src="puzzles.js"></script>
<script src="app.js"></script>
</body>
</html>
